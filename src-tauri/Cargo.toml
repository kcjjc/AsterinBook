[package]
name = "asterinbook"
version = "0.1.1"
edition = "2021"

[lib]
name = "asterinbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "asterinbook"
path = "src/main.rs"
required-features = ["desktop"]

[[example]]
name = "native_smoke"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
